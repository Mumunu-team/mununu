# mununu on-prem bundle — the deployment configuration (deploy/README.md; the format is
# crates/mununu-core/src/deployment.rs). compose.yaml mounts this file at /etc/mununu/mununu.toml.

# The template domains this deployment shows (omit the line for all of them).
enabled_domains = ["rtl", "universal"]

[templates]
# Template packs (TemplateCatalog JSON) layered over the built-in catalog — paths inside the
# container, e.g. a pack kept beside your designs: ["/work/packs/our-rtl-safety.json"].
files = []

[licensing]
# The licence file you were issued; compose mounts it here. Without it the bundle runs as a
# 30-day evaluation counted from the container's first start (docs/licensing.md).
file = "/etc/mununu/mununu.lic"
# Opt-in local usage ledger: one JSON line per verification run (counts, build, licence — never
# design content; docs/licensing.md § The usage ledger). Uncomment here AND the volume in
# compose.yaml so the file outlives the container.
# ledger = "/var/lib/mununu/usage.ndjson"

[server]
# Browser origins, besides loopback, that may read the API's answers (the bundled UI is
# same-origin and needs none). The API has no authentication: see deploy/README.md.
cors_origins = []
# Server-side paths a request names must lie under this directory (your designs, mounted at /work).
file_root = "/work"
