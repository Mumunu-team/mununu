[workspace]
members = ["crates/mununu-core", "crates/mununu-cli", "crates/mununu-extract"]
resolver = "3"

# A virtual manifest (2026-11-09): the product binary is `crates/mununu-cli` (`mununu`); the
# legacy root binary (`src/main.rs`, CTXDSL verbs only) that a bare `cargo build` here used to
# build — and that shared the `target/*/mununu` path with the product, so whichever built last
# won — is removed. Its CLI test moved to `crates/mununu-cli/tests/cli_session.rs`.
[profile.release]
lto = true
codegen-units = 1
# MUST be "unwind" (NOT "abort"): the exact-symbolic BDD engine catches OxiDD
# OutOfMemory on a too-wide cone via std::panic::catch_unwind and abstains to the
# rest of the portfolio (see crates/mununu-core/src/adapter/btor2/symbolic_bitblast.rs).
# `panic = "abort"` calls abort() before catch_unwind can intercept, turning that
# sound abstain into a process SIGABRT (exit 134) in release only. A compile_error!
# guard in mununu-core's crate root enforces this.
panic = "unwind"

# Profiling build: the release binary (LTO, one codegen unit, unwind panics) plus line-table
# debug info so samply / perf / callgrind can attribute samples to functions and lines, and no
# symbol stripping. Same optimisation level as release, so measurements transfer. Output lands
# in target/profiling/. Driver: scripts/profile_cases.py.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Heat-check build: release optimisation WITHOUT fat LTO, so it builds in minutes instead of ten and
# attributes samples to the functions as written (less cross-crate inlining). Used by
# scripts/heat_check.py to ask "did the hot spots move?" before and after every optimisation step;
# wall-clock claims still use `profiling`. Output: target/heat/.
[profile.heat]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
strip = "none"

[profile.dev]
debug = true
opt-level = 0

[profile.test]
debug = true
opt-level = 1

