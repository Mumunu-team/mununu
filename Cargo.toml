[workspace]
members = [".", "crates/mununu-core", "crates/mununu-cli", "crates/mununu-extract"]
resolver = "3"

[package]
name = "mununu"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "CLTS Verification Tool - Formal verification for reactive systems"
repository = "https://github.com/Mumunu-team/mununu"
license-file = "LICENSE"
# Mununu Non-Commercial License → never publishable to crates.io. Also marks this
# as a private/own crate so the cargo-deny license gate skips it (deny.toml).
publish = false
keywords = ["formal-verification", "reactive-systems", "model-checking", "synthesis", "ltl"]
categories = ["science", "algorithms", "development-tools"]

[dependencies]
# Re-export from mununu-core
mununu-core = { path = "crates/mununu-core" }

# Core (still needed for main.rs until P2)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true, features = ["env-filter"] }

# API (optional). The axum/tower/tower-http surface lives in mununu-core;
# the root crate only needs tokio to drive the runtime.
tokio = { version = "1", optional = true, features = ["full"] }


[dev-dependencies]
criterion = "0.8"
proptest = "1.9"
tempfile = "3.24"
itoa = "1.0"
assert_cmd = "2.1"
predicates = "3.1"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing", "dep:tracing-subscriber"]
api = [
    "dep:tokio",
    "mununu-core/api",
    "mununu-core/ast-extract",
]
syntcomp = []  # enables SYNTCOMP benchmark tests (requires mununu-private sibling repo)

[[bin]]
name = "mununu"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
# MUST be "unwind" (NOT "abort"): the exact-symbolic BDD engine catches OxiDD
# OutOfMemory on a too-wide cone via std::panic::catch_unwind and abstains to the
# rest of the portfolio (see crates/mununu-core/src/adapter/btor2/symbolic_bitblast.rs).
# `panic = "abort"` calls abort() before catch_unwind can intercept, turning that
# sound abstain into a process SIGABRT (exit 134) in release only. A compile_error!
# guard in mununu-core's crate root enforces this.
panic = "unwind"

[profile.dev]
debug = true
opt-level = 0

[profile.test]
debug = true
opt-level = 1

