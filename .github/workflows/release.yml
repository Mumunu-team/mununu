# Roadmap I2 — a release from `main`: five archives, each built and smoke-tested natively on its
# own OS and architecture, then published together on a `v*` tag.
#
# What changed from the workflow that produced v0.4.0: that one ran `cargo build --features cli`
# at the workspace ROOT, which builds the root package's legacy `mununu` bin (CTXDSL-only), not
# `crates/mununu-cli` — the product the Docker images ship (`-p mununu-cli`) — and it installed no
# Z3 on any runner. This one builds `-p mununu-cli -p mununu-extract` on a native runner per
# target (no cross-compiling: Z3 is a linked library and cross-linking it needs a foreign libz3
# nobody has), installs Z3 the way docs/toolchain.md § "Z3 on each OS" says, runs
# scripts/release_smoke.sh on the built binaries, and packages them with the licence texts.
#
# `workflow_dispatch` is the dry run: it builds, smokes and uploads the archives as workflow
# artifacts and creates NO release. The release job runs only on a tag.
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            z3: apt
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            z3: apt
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            z3: brew
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            z3: brew
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            z3: zip
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show
      - name: Z3 (apt)
        if: matrix.z3 == 'apt'
        run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - name: Z3 (Homebrew)
        if: matrix.z3 == 'brew'
        run: brew install z3
      # The official x64-win release: z3.exe (z3-sys reads the version from it), libz3.dll (the
      # binary loads it at start, so it ships in the archive) and libz3.lib, copied to z3.lib
      # because the crate links `z3`. Same recipe as os-matrix.yml.
      - name: Z3 (official release zip)
        if: matrix.z3 == 'zip'
        shell: pwsh
        run: |
          $v = '5.1.0'
          Invoke-WebRequest "https://github.com/Z3Prover/z3/releases/download/z3-$v/z3-$v-x64-win.zip" -OutFile "$env:RUNNER_TEMP\z3.zip"
          Expand-Archive "$env:RUNNER_TEMP\z3.zip" -DestinationPath $env:RUNNER_TEMP
          $bin = "$env:RUNNER_TEMP\z3-$v-x64-win\bin"
          Copy-Item "$bin\libz3.lib" "$bin\z3.lib"
          "Z3_LIBRARY_PATH_OVERRIDE=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Z3_BIN=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$bin\z3.exe" --version
      - name: Build
        shell: bash
        run: cargo build --release -p mununu-cli -p mununu-extract
      # The archives are self-contained: libz3 travels beside the binaries, which load it through
      # `$ORIGIN` (Linux, patchelf) / `@executable_path` (macOS, install_name_tool + an ad-hoc
      # re-sign, which arm64 macOS requires after the load command changes) / the DLL search path
      # (Windows). v0.5.10 linked the runner's system Z3 by install name and failed to start on a
      # host with another Z3 version — the first real-host test found it after publishing.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) ver="dry-run-$(git rev-parse --short HEAD)";; esac
          name="mununu-${ver}-${{ matrix.target }}"
          echo "DIST=dist/$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name/LICENSES"
          ext=""; [ "${{ matrix.archive }}" = "zip" ] && ext=".exe"
          cp "target/release/mununu$ext" "target/release/mununu-extract$ext" "dist/$name/"
          cp LICENSE THIRD_PARTY.md "dist/$name/"
          cp LICENSES/* "dist/$name/LICENSES/"
          cp docs/licensing.md "dist/$name/LICENSING.md"
          case "${{ matrix.z3 }}" in
            zip)
              cp "$Z3_BIN/libz3.dll" "dist/$name/" ;;
            brew)
              dylib=$(otool -L "dist/$name/mununu" | awk '/libz3/ {print $1; exit}')
              cp "$dylib" "dist/$name/"
              for b in mununu mununu-extract; do
                install_name_tool -change "$dylib" "@executable_path/$(basename "$dylib")" "dist/$name/$b"
                codesign --force --sign - "dist/$name/$b"
              done
              otool -L "dist/$name/mununu" | grep z3 ;;
            apt)
              sudo apt-get install -y patchelf
              so=$(ldconfig -p | awk '/libz3\.so\.4 / {print $NF; exit}')
              cp "$so" "dist/$name/"
              patchelf --set-rpath '$ORIGIN' "dist/$name/mununu" "dist/$name/mununu-extract"
              patchelf --print-rpath "dist/$name/mununu" ;;
          esac
          ls -l "dist/$name"
      # The proof of self-containment: the runner's own Z3 is removed before the packaged binary
      # runs the smoke. If the bundled copy were not the one loaded, this step would fail.
      - name: Remove the runner's Z3
        shell: bash
        run: |
          case "${{ matrix.z3 }}" in
            brew) brew uninstall --ignore-dependencies z3 ;;
            apt)  sudo apt-get remove -y libz3-dev libz3-4 ;;
            zip)  rm -rf "$Z3_BIN" ;;
          esac
      - name: Smoke-test the packaged binaries on this OS, without a system Z3
        shell: bash
        run: |
          ext=""; [ "${{ matrix.archive }}" = "zip" ] && ext=".exe"
          scripts/release_smoke.sh "$DIST/mununu$ext" "$DIST/mununu-extract$ext"
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "$DIST")
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          ls -l
      - name: Upload the archive
        uses: actions/upload-artifact@v6
        with:
          name: mununu-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Five self-contained archives, each built and smoke-tested on its own OS with the runner's
            system Z3 removed first (`scripts/release_smoke.sh`). Each carries `mununu`, `mununu-extract`,
            the Z3 shared library beside them (`libz3.so.4` / `libz3.<v>.dylib` / `libz3.dll`, MIT —
            `LICENSES/Z3-MIT.txt`), `LICENSE`, `THIRD_PARTY.md`, `LICENSES/` and `LICENSING.md`. Linux
            needs glibc ≥ 2.39 (built on Ubuntu 24.04). The engine-only tier: SystemVerilog
            verification needs the `mununu-sva` image (see `docs/install.md`, `docs/release.md`).
          files: artifacts/*
