name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read

# A new push to the same PR cancels the superseded run (2026-10-26: 331 runs in 30 days, each
# ~14 min of runner time); a push to `main` is never cancelled, so the merge record stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  # Build the pinned dev image once and run the same `make ci` line that
  # contributors use locally. The hw-verif principle: same docker run
  # invocation must work locally and in CI — if it doesn't, the contract
  # is broken.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build mununu-dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: mununu-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dependency cache (2026-10-27). The container compiles into /cargo-target and reads
      # crates from /usr/local/cargo/registry; both are bind-mounted from the runner so
      # rust-cache can restore and save them between runs (key: the manifests, Cargo.lock, the
      # toolchain file, the job). rust-cache prunes the workspace crates' artifacts on save, so
      # a hit leaves `make ci` compiling mununu-core / -cli / -extract and nothing else; a miss
      # is the full compile this job always ran. Saved from `main` only, so one cache serves
      # every PR instead of one per branch. The container runs as root, hence the ownership
      # fix before the post-run save. The `make ci` line itself is unchanged.
      - name: Restore the dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .ci-target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run lint + tests in the dev image
        run: |
          mkdir -p .ci-target "$HOME/.cargo/registry"
          docker run --rm -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/.ci-target:/cargo-target \
            -v "$HOME/.cargo/registry":/usr/local/cargo/registry \
            mununu-dev:latest make ci

      - name: Hand the cache directories back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-target "$HOME/.cargo/registry"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Install cargo-audit as a PREBUILT binary. `rustsec/audit-check@v2` runs
      # `cargo install cargo-audit`, which builds the tool from source and has been
      # failing to compile `cargo-audit v0.22.2` on the runner (a build failure of the
      # tool, not a real advisory) — leaving this job perpetually red. The prebuilt
      # binary skips the compile entirely.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Copyleft gate on the LINKED crate graph (deny.toml). Fails if any
      # dependency's license isn't in the permissive allow-list — protects the
      # Mununu Non-Commercial License from GPL/AGPL/LGPL contamination. External
      # CLI tools (yosys/sv2v/cvc5/Verilator/slang) are subprocesses, not linked,
      # so they're out of scope here (see docs/external-tools.md).
      - name: Check dependency licenses
        run: cargo deny check licenses

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  tokei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: Count lines of code
        run: tokei --output json > tokei.json
      - uses: actions/upload-artifact@v6
        with:
          name: tokei-report
          path: tokei.json

  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          if command -v cargo-outdated &> /dev/null; then
            cargo outdated || echo "Some dependencies are outdated. Run 'cargo outdated' locally to see details."
          else
            echo "cargo-outdated not available. Skipping outdated dependency check."
          fi
