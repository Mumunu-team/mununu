name: E2E (SVA verification)

# The `#[ignore]`d end-to-end suite (`make e2e`) shells out to the external
# SystemVerilog toolchain — slang + sv2v + yosys, plus btormc for the
# reachability differential and Verilator for the counterexample-replay gate.
# Those tools are contributor-installed, not bundled, so `make ci` (in ci.yml)
# skips these tests. This workflow runs them in the `mununu-sva` image, which
# pins the whole chain, so the corpus monotone-verdict ledger, the
# cegar↔symbolic↔exact parity gate, the portfolio e2e, and the RTL-replay gate
# run automatically instead of only on a manual local docker invocation.
#
# Nightly (schedule) + on-demand (workflow_dispatch); not per-PR — building the
# sva image + running the full corpus under real slang/yosys/Verilator costs
# minutes, disproportionate for every push. A red run here is a soundness/
# precision regression the fast PR gate cannot see.
#
# HISTORY — read before trusting a streak, green or red. From its addition
# (2026-07-06) until 2026-09-18 this workflow produced NO verification signal:
# every scheduled run failed at "Build mununu-sva image", because
# `docker/Dockerfile.sva` did `COPY --from=hw-verif:latest` — an image built
# from the sibling `hw-verification-uba` repo that exists only on a
# contributor's machine and was never published, so CI could not pull it. The
# schedule was disabled on 2026-09-09 (#529) rather than left permanently red:
# a workflow that is always red signals nothing and trains people to ignore
# it. That is also how the `#[ignore]`d set drifted to 19 failures unnoticed
# (mununu#503) — not "nobody read the nightly", there was nothing to read.
#
# Restored 2026-09-18 (option (a) of #529): `Dockerfile.sva` now downloads a
# tag-pinned PUBLIC YosysHQ oss-cad-suite release, so the image builds on any
# runner. Until this workflow has a run history you can read, the LOCAL sweep
# in the image stays the e2e signal to act on, and is the way to reproduce one
# test either way:
#   docker run --rm -v "$(pwd)":/work -v mununu-target:/cargo-target \
#     mununu-sva make e2e
# (`make e2e` runs one test per process — mununu#504 — so an aborting test
# reports as one CRASH row instead of destroying the run's summary.)

on:
  schedule:
    # 04:00 UTC nightly (after typical merge activity settles).
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sva-e2e:
    runs-on: ubuntu-latest
    # A hung test must not burn the default six hours; the local sweep takes
    # well under this on a laptop with a warm cache, and the runner has none.
    timeout-minutes: 240
    # slang ships prebuilts for linux-x86_64 (this runner) + macos-arm64 only;
    # ubuntu-latest is linux-x86_64, so the toolchain resolves natively.
    steps:
      - uses: actions/checkout@v5

      # A from-scratch `--all-features` test build (tens of GB with incremental
      # artifacts) plus a ~5.5 GB image does not fit beside the runner's
      # preinstalled toolchains. Drop the ones this job never touches.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The sva image extends `mununu-dev` (FROM mununu-dev), so build dev first
      # and tag it locally for the sva build to pick up.
      - name: Build mununu-dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: mununu-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Plain `docker build` (not build-push-action) so the `FROM mununu-dev:latest`
      # base resolves against the image the previous step loaded into the daemon —
      # a buildx `docker-container` builder cannot see locally-loaded images.
      # This step downloads the ~1 GB suite tarball on every run (no gha cache
      # on this path); acceptable for a nightly.
      - name: Build mununu-sva image
        run: docker build -f docker/Dockerfile.sva -t mununu-sva:latest .

      - name: Report the toolchain this run verifies with
        run: |
          docker image inspect mununu-sva:latest \
            -f '{{ range $k, $v := .Config.Labels }}{{ $k }}={{ $v }}{{ "\n" }}{{ end }}' \
            | grep '^io.github.mumunu-team'

      # Same `make e2e` line a contributor runs locally (the hw-verif principle:
      # the docker invocation must work identically in CI and on a laptop).
      # No cargo cache survives a runner, so incremental artifacts are pure
      # disk cost here.
      - name: Run the SVA e2e suite in the sva image
        run: |
          docker run --rm -e CARGO_INCREMENTAL=0 \
            -v ${{ github.workspace }}:/work mununu-sva:latest \
            make e2e
