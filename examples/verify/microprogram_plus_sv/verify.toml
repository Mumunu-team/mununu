# microprogram_plus_sv — hand-authored CTXDSL microcode + real SV
# peripheral via the general verify framework.
#
# The point of this example is to demonstrate the framework's
# adapter-agnosticism: the orchestrator pairs a `ctxdsl` source
# (microcode authored by hand) with an `sv-yosys` source (real SV
# elaborated via read_slang → Yosys → BTOR2 → KMTS bit-blast) under one
# `verify.toml`. The two automata have disjoint label alphabets here
# (the microcode steps on `tick_microcode`; the SV side steps on the
# bit-blaster's clock label), so the asynchronous composition just
# interleaves their independent state spaces — no rendezvous
# synchronisation. Direct alphabet binding.
#
# The KMTS SV path names its single automaton `Circuit`, and exposes
# the FSM register as a numeric valuation, so the peripheral property
# references the enum state by value (`state == 2` is ACTIVE in the
# {IDLE=0, WAIT_ACK=1, ACTIVE=2, DONE=3} encoding) rather than by the
# native adapter's variant-named predicate.

[project]
name = "MicroprogramPlusSv"

[[sources]]
id = "microcode"
adapter = "ctxdsl"
files = ["microprogram.ctxdsl"]

[[sources]]
id = "peripheral"
adapter = "sv-yosys"
files = ["handshake_peripheral.sv"]

[alphabet]
strategy = "direct"

[composition]
semantics = "asynchronous"
members = ["microcode", "peripheral"]
name = "Driver"

[[properties]]
# Microprogram never deadlocks — every state has at least one outgoing
# transition. Holds because the microcode FSM is a cycle.
name = "microcode_no_deadlock"
template = "no_deadlock"
over = "Microprogram"

[[properties]]
# Peripheral reachability — the KMTS bit-blast automaton eventually
# visits ACTIVE (state == 2 in the enum encoding).
name = "peripheral_reaches_active"
formula = "mu X. ((state == 2) || <> X)"
over = "Circuit"

[[properties]]
# Composed-system no-deadlock — vacuous on this asynchronous
# interleaving (each side keeps cycling), but exercises the realiser
# against the full product state space.
name = "composed_no_deadlock"
template = "no_deadlock"
over = "Driver"
