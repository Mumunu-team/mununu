[package]
name = "mununu-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu CLI — command-line interface for verification and synthesis"
repository = "https://github.com/Mumunu-team/mununu"
license-file = "../../LICENSE"
# Mununu Non-Commercial License → not for crates.io; marks this a private/own
# crate so the cargo-deny license gate skips it (deny.toml).
publish = false

[[bin]]
name = "mununu"
path = "src/main.rs"

[dependencies]
mununu-core = { path = "../mununu-core", features = ["api", "ast-extract"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
bitvec = "1.0"

[dev-dependencies]
tempfile = "3.24"

[features]
default = []
# `smt` feature removed in Phase A.4 step 4.2 — Z3 is now mandatory in
# mununu-core. See its Cargo.toml for the rationale.
