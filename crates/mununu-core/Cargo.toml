[package]
name = "mununu-core"
version = "0.5.11"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu core library — verification engine, adapters, composition, evaluation"
repository = "https://github.com/Mumunu-team/mununu"
license-file = "../../LICENSE"
# Mununu Non-Commercial License → not for crates.io; marks this a private/own
# crate so the cargo-deny license gate skips it (deny.toml).
publish = false

[dependencies]
# Core
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# `unbounded_depth` exposes `Deserializer::disable_recursion_limit()` — needed to parse
# slang's deeply-nested `--ast-json` (default limit is 128; deep expression trees like
# the z80 core's overflow it). Guarded by an explicit `Value::deserialize` call site.
serde_json = { version = "1.0", features = ["unbounded_depth"] }
bitvec = "1.0"
smallvec = "1.15"
regex = "1.12"
# Arbitrary-precision magnitudes for the concrete bit-vector evaluator's >128-bit
# path (`adapter::btor2::bv::Bv::Wide`); the ≤128-bit path stays on native u128.
num-bigint = "0.4"
num-traits = "0.2"

# OxiDD — pure-Rust decision-diagram framework (BDD). Backs the R-F5 symbolic
# abstraction path: predicate-cube state sets + the may/must transition relation as
# BDDs, with fixpoint image/preimage via the native fused relational product
# `apply_exists(And, …)` — the alternative to explicit-cube enumeration + the
# O(2^2|P|) SMT edge computation. Pure-Rust (no new C build), permissive
# (MIT OR Apache-2.0), `Send + Sync` manager. Not feature-gated — the symbolic path
# is a first-class engine (R-F5).
oxidd = "0.13"

# CMSIS-SVD / IP-XACT importer for register-map sidecars (Document C
# task C6). Small, zero-dep DOM parser well-suited to one-shot config
# parsing. Pulled in unconditionally because `codesign::svd_import` is
# a default feature of the codesign module — the importer is the only
# realistic way to author register maps for any non-toy peripheral.
roxmltree = "0.20"

# TOML parser for the `verify.toml` general verification-project schema
# (verify::config) and its `mununu.codesign.toml` shorthand
# (codesign::project_config). Pulled in unconditionally because both
# schemas are part of the default core surface.
toml = "0.8"

# Tracing — used unconditionally for structured diagnostics (gap markers,
# soundness warnings, perf instrumentation). No-op when no subscriber is
# installed, so the cost is negligible for library callers.
tracing = "0.1"

# Process-memory RSS reader — used by the mununu#490 self-imposed memory
# ceiling (`MUNUNU_MAX_PROCESS_MEMORY_BYTES`). Small, purpose-built,
# cross-platform (macOS / linux / windows), no unsafe surface in mununu. The
# ceiling turns an OS-level `abort()` on allocator failure into a graceful
# `unknown` verdict at per-property + per-engine-entry granularity — mirrors
# the existing `MUNUNU_BDD_*` budget vocabulary in CLAUDE.md. Not
# feature-gated: the check is a no-op when the env var is unset.
memory-stats = "1"

# VCD parser — used by §Phase 9 R-S6 (VCD trace mining). Reads
# IEEE-1364 Value Change Dump files produced by Verilator / VCS /
# QuestaSim / Icarus regression suites; mininu mines them for
# observed-value-frequency seeding of the bit-blaster's EnumValues
# discriminators. Canonical Rust VCD crate (~3 KLOC, narrow scope,
# stable API since 2018). Per CLAUDE.md "Code Reuse" — established
# library beats hand-rolling.
vcd = "0.7"

# API (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "timeout", "fs"] }
tokio = { version = "1", optional = true, features = ["full"] }
# JSON Schema derivation for the API wire types — powers `docs/api-schemas/`
# generated schema files + the drift-detector test that ensures the committed
# schemas match the current Rust types. Feature-gated behind `api` since the
# derived types themselves are api-only. Chosen over `utoipa` because we
# don't (yet) need a full OpenAPI spec / axum handler integration —
# consumers want the schema file, not a runtime `/openapi.json` endpoint.
schemars = { version = "0.8", optional = true }
# MCP server (optional, feature `mcp`): the official Rust SDK. `server` is the handler trait and
# the tool model, `transport-io` the stdio transport. `macros` is NOT enabled: the tools are
# declared by hand from the `schemars` 0.8 schemas the API already publishes (rmcp's own
# `schemars` is 1.x), so the advertised `inputSchema` is byte-for-byte
# `docs/api-schemas/context-eval-request.schema.json`.
rmcp = { version = "3.9", optional = true, default-features = false, features = ["server", "transport-io"] }

# AST extraction (optional — tree-sitter grammars for source code analysis)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }

# SMT solver — z3 for predicate-image discovery and RTL value discovery.
# Mandatory dependency since Phase A.4 step 4.2. Uses the system Z3
# (libz3-dev on Debian / Z3 via homebrew on macOS) by default — the
# dev-container Dockerfile installs `libz3-dev`. To build with the
# bundled Z3 source (slower; runner-OOM-prone in CI), enable the
# `z3/bundled` feature explicitly:
#   cargo build --features z3/bundled
z3 = { version = "0.21" }

# N5.0 (Track N) — CaDiCaL 1.9.5, in-process, the SAT core of the owned bit-level engines (the
# AIG → CNF BMC now, the owned IC3 next). Chosen over `rustsat-cadical` because it builds with a C++
# compiler alone: `rustsat-cadical` runs bindgen on every build, which needs libclang on every
# host and image (the `mununu-sva` image has none; measured 2026-11-13). MIT.
cadical = "0.1.16"

# Optional / feature-gated:
#   `test_support`: deterministic CLTS generators (chain/ring/grid/hypercube/...)
#       used by tests, proptests, stress tests, and the bench harness fixtures.
#   `stress`: gates the tier-3 stress tests in tests/stress_*.rs.
#   `dhat`: enables the dhat heap profiler in stress tests.
# These features pull `rand`/`rand_chacha` (deterministic via ChaCha20Rng) and
# `dhat` only when needed, so release builds and the default feature set stay
# allocation-free of test machinery.
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
dhat = { version = "0.3", optional = true }

# In-process Boolector (bit-vector SAT model checker) — the owned-standalone
# scalable-safety back-end's fast-BV member. Both the Rust wrapper crate and the
# Boolector C library are MIT-licensed (no copyleft; clean under `cargo deny
# check licenses`). `vendor-lgl` builds Boolector + Lingeling + btor2tools from
# the crate's bundled/setup-script sources via cmake (no system Boolector
# needed), so the feature is self-contained given a C toolchain + cmake (both in
# `mununu-dev`). Feature-gated because it C-compiles Boolector; the default
# `make ci` build stays Boolector-free. Built + tested in the `mununu-dev` image
# with `--features boolector`.
boolector = { version = "0.4", optional = true, features = ["vendor-lgl"] }
ed25519-dalek = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Process-group kill of external solver members (mununu#875); already in the tree via std's deps.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# mununu#904 — the Windows counterpart of the process-group kill: a Job Object per solver member
# (`TerminateJobObject` kills everything the member forked). Already in the lock file through
# other crates' Windows deps.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
# The MCP seam test drives the server through an in-process client (`client`) over a tokio duplex
# pipe; the product build never carries the client side.
rmcp = { version = "3.9", default-features = false, features = ["server", "client", "transport-io"] }
criterion = "0.8"
proptest = "1.9"
tempfile = "3.24"
itoa = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dep:schemars"]
# The MCP server (`mununu mcp`): a third transport of the HTTP API's ops, so it implies `api`.
mcp = ["api", "dep:rmcp"]
ast-extract =["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-python", "dep:tree-sitter-rust"]
syntcomp = []
# Optimization-programme features (see notebook/0000-overview.md). Each is
# additive and can be enabled per-bench, per-test, or per-CI-tier.
test_support = ["dep:rand", "dep:rand_chacha"]
stress = ["test_support"]
dhat = ["dep:dhat"]
# In-process Boolector fast-BV reachability engine (owned-standalone portfolio
# member). C-compiles Boolector, so it is opt-in — validated in Docker, not in
# the default `make ci`.
boolector = ["dep:boolector"]
# mununu#553 W-3'' — OxiDD's per-operation apply-cache counters (calls / cache queries / cache
# hits / reduced). DIAGNOSTIC ONLY and opt-in: the counters are atomics on the hot path, so they
# perturb the very timings they are used to explain. Enabled to answer one question — a consumer
# block costs 10.9x the WORK under a different variable order at 1.08x the node count, which is
# what a cache that stops hitting looks like. Measure with it, ship without it.
oxidd-statistics = ["oxidd/statistics"]

[[test]]
name = "api_graph_valuations"
required-features = ["api"]

[[test]]
name = "context_eval_unsupported_fields_862"
required-features = ["api"]

[[test]]
name = "api_unread_fields_865"
required-features = ["api"]

[[test]]
name = "cegar_may_edge_default_867"
required-features = ["api"]

[[bench]]
name = "clts_composition"
harness = false

[[bench]]
name = "mu_calculus"
harness = false

[[bench]]
name = "controller"
harness = false

[[bench]]
name = "xstate"
harness = false

[[bench]]
name = "predicate_cube_lift"
harness = false

[[bench]]
name = "lazy_lift"
harness = false

[[bench]]
name = "exact_symbolic"
harness = false

# Optimization-programme isolated benches. Each requires the test_support
# feature for deterministic CLTS generators (rand_chacha::ChaCha20Rng).
# Run with:
#   cargo bench --features test_support --bench <name>
[[bench]]
name = "clts_construction"
harness = false
required-features = ["test_support"]

[[bench]]
name = "composition_only"
harness = false
required-features = ["test_support"]

[[bench]]
name = "minimization_only"
harness = false
required-features = ["test_support"]

[[bench]]
name = "mu_calculus_only"
harness = false
required-features = ["test_support"]

# dhat memory-profile binary for EXP-0002b-mem. Replays the
# synthesis_product_game/grid_32x32 workload with dhat's heap profiler
# wired to the global allocator. Produces dhat-heap.json in cwd; archive
# alongside the EXP. Requires both test_support (for the fixture) and
# dhat (for the profiler).
[[bin]]
name = "dhat_synthesis"
path = "src/bin/dhat_synthesis.rs"
required-features = ["test_support", "dhat"]
