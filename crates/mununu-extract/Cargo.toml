[package]
name = "mununu-extract"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu extraction frontend — AST-based model extraction from source code"
repository = "https://github.com/Mumunu-team/mununu"
license-file = "../../LICENSE"
# Mununu Non-Commercial License → not for crates.io; marks this a private/own
# crate so the cargo-deny license gate skips it (deny.toml).
publish = false

[[bin]]
name = "mununu-extract"
path = "src/main.rs"

[dependencies]
mununu-core = { path = "../mununu-core", features = ["ast-extract"] }
serde = "1.0"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
